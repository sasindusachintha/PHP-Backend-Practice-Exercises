<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="mb-4 text-primary">Add New Student</h3>

    <!-- FORM -->
    <form onsubmit="validateForm(event)">

      <!-- 1. Full Name -->
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" id="fullName" class="form-control" placeholder="Enter Full Name" required>
      </div>

      <!-- 2. Student ID -->
      <div class="mb-3">
        <label class="form-label">Student ID</label>
        <input type="text" id="studentId" class="form-control" placeholder="Enter Student ID" required>
      </div>

      <!-- 3. Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email address" required>
      </div>

      <!-- 4. Phone -->
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="07XXXXXXXX" required>
      </div>

      <!-- 5. Date of Birth -->
      <div class="mb-3">
        <label class="form-label">Date of Birth</label>
        <input type="date" id="dob" class="form-control" required>
      </div>

      <!-- 6. Gender -->
      <div class="mb-3">
        <label class="form-label">Gender</label>
        <select id="gender" class="form-select" required>
          <option value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>

      <!-- 7. Address -->
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea id="address" class="form-control" rows="2" placeholder="Enter address" required></textarea>
      </div>

      <!-- 8. Course -->
      <div class="mb-3">
        <label class="form-label">Course</label>
        <input type="text" id="course" class="form-control" placeholder="e.g. Computer Science" required>
      </div>

      <!-- 9. Year -->
      <div class="mb-3">
        <label class="form-label">Academic Year</label>
        <select id="year" class="form-select" required>
          <option value="">Select year</option>
          <option>Year 1</option>
          <option>Year 2</option>
          <option>Year 3</option>
          <option>Year 4</option>
        </select>
      </div>

      <!-- 10. Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Create password" required>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary w-100">
        Add Student
      </button>

    </form>
  </div>
</div>

<!-- JAVASCRIPT -->
<script>
function validateForm(event) {
    event.preventDefault();

    let name = document.getElementById("fullName").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();

    // Check empty fields
    if (name === "" || email === "" || phone === "") {
        alert("⚠️ Please fill all required fields!");
        return;
    }

    // Email validation
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        alert("⚠️ Please enter a valid email address!");
        return;
    }

    // Phone validation (min 10 digits)
    if (!/^[0-9]{10,}$/.test(phone)) {
        alert("⚠️ Phone number must be at least 10 digits!");
        return;
    }

    // Success
    alert("✅ Student added successfully!");
}
</script>

</body>
</html>
